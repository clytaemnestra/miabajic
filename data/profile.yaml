# First text on the homepage. Assistants and search engines quote this paragraph.
bio:
  - >-
    Mia Bajić is a Staff Software Engineer at SentinelOne, where she works on backend and
    infrastructure: she takes applications built with AI tools and turns them into production
    services deployed on Kubernetes. She is a Fellow of the Python Software Foundation, Vice Chair
    of the EuroPython Society, and the host of the podcast Behind the Commit. Mia Bajić is
    based in Prague.
  - >-
    She has given keynotes at DjangoCon Europe 2025 and PyCon Lithuania 2026, and talks at
    PyCon US (2024, 2025, 2026), EuroPython, FOSDEM, PyCon UK, PyCon Ireland, PyCon France,
    PyCon Italia, PyCon Namibia, DjangoCon Europe, OpenFest and WebExpo.
  - >-
    She has co-organized Pyvo Prague since 2022, co-organized PyCon CZ 2023, and was the main
    organizer of Python Pizza Prague 2024.

