talks:
  - slug: hash-me-if-you-can-python-dictionaries
    title: "Hash me if you can: let's talk about Python dictionaries!"
    # abstract condensed from https://us.pycon.org/2026/schedule/presentation/90/
    abstract: "How hash tables work under Python dictionaries, what the 2011 \"hash flooding\" vulnerability taught about algorithmic complexity attacks, why hash seeds are randomized, and why hash(-1) == hash(-2). Ends with a tour of Bloom filters and consistent hashing."
    tags: [Python, CPython internals, dictionaries]
    deliveries:
      - event: PyCon US 2026
        date: 2026-05-16
        city: Long Beach
        country: United States
        type: talk
        slides_url: https://github.com/clytaemnestra/talks/blob/main/dictionaries.pdf
        video_url: https://www.youtube.com/watch?v=kHtg-2JMEgk

  - slug: python-public-roadmap
    title: "Your Python has a public roadmap. Most engineers never read it."
    # abstract condensed from https://pretalx.com/pycon-lithuania-2026/talk/WZBDEZ/
    abstract: "Python's technical roadmap is public, yet most engineers only find out about language changes when something breaks in CI. The keynote is about learning to read that roadmap, and about the community governance that makes it public."
    tags: [Python, PEPs, CPython]
    deliveries:
      - event: PyCon Lithuania 2026
        date: 2026-04-08
        city: Vilnius
        country: Lithuania
