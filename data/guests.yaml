- name: Hugo van Kemenade
  bio: >-
    Release Manager for Python 3.14 and 3.15, fellow at the Sovereign Tech Agency, maintainer of
    open source projects such as Pillow, and co-organizer of local Python events in Helsinki.
  website: https://hugovk.dev/

- name: Pablo Galindo Salgado
